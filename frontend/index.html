<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Management</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; background: #f4f4f4; }
  h1 { color: #222; }
  h2 { color: #222; margin: 0 0 10px 0; font-size: 18px; }

  .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; }

  /* Student form */
  #alunoForm { background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
  #alunoForm h2 { grid-column: span 2; }
  input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
  #alunoForm button { grid-column: span 2; padding: 10px; background: #2c7be5; color: white; border: none; border-radius: 4px; cursor: pointer; }
  #alunoForm button:hover { background: #1a5fc4; }
  #cancelEdit { background: #999 !important; display: none; }

  /* Course card: add form + compact list of chips */
  #cursoForm { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-bottom: 15px; }
  #cursoForm button { padding: 8px 16px; background: #ff0000; color: white; border: none; border-radius: 4px; cursor: pointer; }
  #cursoForm button:hover { background: #ff0000; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; max-height: 120px; overflow-y: auto; }
  .chip { display: inline-flex; align-items: center; gap: 8px; background: #eef3fb; border: 1px solid #cfe0fa; border-radius: 16px; padding: 4px 6px 4px 12px; font-size: 14px; }
  .chip button { border: none; background: #d9534f; color: white; border-radius: 50%; width: 20px; height: 20px; line-height: 1; padding: 0; cursor: pointer; }
  .chip button:hover { background: #b52b27; }
  .empty { color: #777; font-size: 14px; }

  /* Students table */
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
  th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
  th { background: #ff0000; color: white; }
  button.action { margin-right: 5px; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; }
  .edit-btn { background: #f0ad4e; color: white; }
  .delete-btn { background: #d9534f; color: white; }
</style>
</head>
<body>

<h1>Student Management</h1>

<!-- Courses: add a course, and a compact list of existing ones (click x to delete) -->
<div class="card">
  <h2>Courses</h2>
  <form id="cursoForm">
    <input type="text" id="nomeDoCurso" placeholder="New course name" required>
    <button type="submit">Add Course</button>
  </form>
  <div id="cursosList" class="chips"></div>
</div>

<!-- Form used for both creating and editing a student (aluno) -->
<form id="alunoForm">
  <h2>Student</h2>
  <input type="hidden" id="alunoId">
  <input type="text" id="nome" placeholder="First name" required>
  <input type="text" id="apelido" placeholder="Last name" required>
  <select id="idCurso" required></select>
  <input type="number" id="anoCurricular" placeholder="Academic year (1-6)" min="1" max="6" step="1" required>
  <input type="number" id="idade" placeholder="Age (15-100)" min="15" max="100" step="1" required>
  <button type="submit" id="submitBtn">Add Student</button>
  <button type="button" id="cancelEdit">Cancel Edit</button>
</form>

<table>
  <thead>
    <tr>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Course</th>
      <th>Year</th>
      <th>Age</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="alunosTableBody"></tbody>
</table>

<script>
const API_URL = "https://restapi-backend-67yt.onrender.com/alunos";
const CURSOS_URL = "https://restapi-backend-67yt.onrender.com/cursos";

let cursosMap = {}; // maps idCurso -> course name, for display in the table
let maxIdCurso = 0; // highest idCurso so far, used to generate the next one

const form = document.getElementById("alunoForm");
const cursoForm = document.getElementById("cursoForm");
const tableBody = document.getElementById("alunosTableBody");
const cursosList = document.getElementById("cursosList");
const idCursoSelect = document.getElementById("idCurso");
const submitBtn = document.getElementById("submitBtn");
const cancelBtn = document.getElementById("cancelEdit");
const alunoIdField = document.getElementById("alunoId");

// Load courses into the dropdown, the chip list and the lookup map
async function loadCursos() {
  const res = await fetch(CURSOS_URL);
  const cursos = await res.json();
  const selected = idCursoSelect.value; // keep current selection after reload
  idCursoSelect.innerHTML = "";
  cursosList.innerHTML = "";
  cursosMap = {};
  maxIdCurso = 0;

  if (cursos.length === 0) {
    cursosList.innerHTML = '<span class="empty">No courses yet.</span>';
  }

  cursos.forEach(curso => {
    cursosMap[curso.idCurso] = curso.nomeDoCurso;
    if (curso.idCurso > maxIdCurso) maxIdCurso = curso.idCurso;

    const option = document.createElement("option");
    option.value = curso.idCurso;
    option.textContent = curso.nomeDoCurso;
    idCursoSelect.appendChild(option);

    const chip = document.createElement("span");
    chip.className = "chip";
    chip.appendChild(document.createTextNode(curso.nomeDoCurso));
    const delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.textContent = "×";
    delBtn.title = "Delete course";
    delBtn.setAttribute("aria-label", "Delete course " + curso.nomeDoCurso);
    delBtn.addEventListener("click", () => deleteCurso(curso._id, curso.nomeDoCurso));
    chip.appendChild(delBtn);
    cursosList.appendChild(chip);
  });

  if (selected) idCursoSelect.value = selected;
}

// Create a new course; idCurso is the next free number
cursoForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const curso = {
    idCurso: maxIdCurso + 1,
    nomeDoCurso: document.getElementById("nomeDoCurso").value
  };

  await fetch(CURSOS_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(curso)
  });

  cursoForm.reset();
  await loadCursos();
  loadAlunos();
});

// Delete a course after confirmation (the API refuses if students still use it)
async function deleteCurso(id, name) {
  if (!confirm(`Delete the course "${name}"?`)) return;
  const res = await fetch(`${CURSOS_URL}/${id}`, { method: "DELETE" });
  if (!res.ok) {
    const err = await res.json();
    alert(err.error || "Could not delete the course.");
    return;
  }
  await loadCursos();
  loadAlunos();
}

// Load students and render them into the table
async function loadAlunos() {
  const res = await fetch(API_URL);
  const alunos = await res.json();
  tableBody.innerHTML = "";
  alunos.forEach(aluno => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${aluno.nome}</td>
      <td>${aluno.apelido}</td>
      <td>${cursosMap[aluno.idCurso] || aluno.idCurso}</td>
      <td>${aluno.anoCurricular}</td>
      <td>${aluno.idade}</td>
      <td>
        <button class="action edit-btn" onclick="editAluno('${aluno._id}')">Edit</button>
        <button class="action delete-btn" onclick="deleteAluno('${aluno._id}')">Delete</button>
      </td>
    `;
    tableBody.appendChild(row);
  });
}

// Handle form submit: create a new student, or update one if we're in edit mode
form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const aluno = {
    nome: document.getElementById("nome").value,
    apelido: document.getElementById("apelido").value,
    idCurso: parseInt(idCursoSelect.value),
    anoCurricular: parseInt(document.getElementById("anoCurricular").value),
    idade: parseInt(document.getElementById("idade").value)
  };

  const id = alunoIdField.value;

  if (id) {
    // Edit mode -> PUT to update the existing student
    await fetch(`${API_URL}/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(aluno)
    });
  } else {
    // Create mode -> POST a new student
    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(aluno)
    });
  }

  resetForm();
  loadAlunos();
});

// Fill the form with an existing student's data so it can be edited
async function editAluno(id) {
  const res = await fetch(`${API_URL}/${id}`);
  const aluno = await res.json();

  alunoIdField.value = aluno._id;
  document.getElementById("nome").value = aluno.nome;
  document.getElementById("apelido").value = aluno.apelido;
  idCursoSelect.value = aluno.idCurso;
  document.getElementById("anoCurricular").value = aluno.anoCurricular;
  document.getElementById("idade").value = aluno.idade;

  submitBtn.textContent = "Save Changes";
  cancelBtn.style.display = "inline-block";
}

// Delete a student after confirmation
async function deleteAluno(id) {
  if (!confirm("Are you sure you want to delete this student?")) return;
  await fetch(`${API_URL}/${id}`, { method: "DELETE" });
  loadAlunos();
}

// Cancel edit mode and reset the form back to "create" state
cancelBtn.addEventListener("click", resetForm);

function resetForm() {
  form.reset();
  alunoIdField.value = "";
  submitBtn.textContent = "Add Student";
  cancelBtn.style.display = "none";
}

// Show form validation messages in English, regardless of the browser language
document.querySelectorAll("input, select").forEach(el => {
  el.addEventListener("invalid", () => {
    if (el.validity.valueMissing) {
      el.setCustomValidity("Please fill out this field.");
    } else if (el.validity.rangeUnderflow || el.validity.rangeOverflow || el.validity.stepMismatch || el.validity.badInput) {
      el.setCustomValidity(`Please enter a whole number between ${el.min} and ${el.max}.`);
    }
  });
  el.addEventListener("input", () => el.setCustomValidity(""));
});

// Initial load: courses first (needed for the dropdown/lookup), then students
loadCursos().then(loadAlunos);
</script>

</body>
</html>
